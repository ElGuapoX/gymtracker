<html lang="es">
<head>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231A1918'/%3E%3Crect x='20' y='44' width='60' height='12' rx='3' fill='%23B5502F'/%3E%3Crect x='10' y='36' width='10' height='28' rx='3' fill='%23F3EFE6'/%3E%3Crect x='80' y='36' width='10' height='28' rx='3' fill='%23F3EFE6'/%3E%3C/svg%3E">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior-y: none; }
  body {
    background: #1A1918;
    font-family: -apple-system, 'Inter', sans-serif;
    color: #F3EFE6;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .display { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; letter-spacing: 0.01em; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  #content { flex: 1; overflow-y: auto; padding: 0 16px 100px; -webkit-overflow-scrolling: touch; }
  .header { padding: 20px 16px 8px; }
  .header h1 { margin: 0; font-size: 30px; }
  .header .bar { width: 40px; height: 4px; background: #B5502F; border-radius: 2px; margin-top: 8px; }

  .card { background: #F3EFE6; color: #1A1918; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  .card .sub { color: #8B8680; font-size: 13px; }

  .btn { border: none; border-radius: 14px; padding: 13px; font-weight: 600; font-size: 15px; text-align: center; cursor: pointer; }
  .btn-primary { background: #B5502F; color: #F3EFE6; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-ghost { background: transparent; border: 2px dashed #4A4844; color: #F3EFE6; width: 100%; border-radius: 18px; padding: 16px; }
  .btn-routine { width: 100%; text-align: left; background: #F3EFE6; border-radius: 18px; padding: 16px; margin-bottom: 12px; border: none; }

  input, select {
    width: 100%; border-radius: 10px; padding: 9px 12px; font-size: 14px;
    border: 1px solid #E4DFCF; background: #fff; color: #1A1918;
  }
  input:focus, select:focus { outline: 2px solid #B5502F; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row-set { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .set-num { width: 18px; font-size: 11px; color: #8B8680; }
  .icon-btn { background: none; border: none; color: #B5502F; padding: 4px; cursor: pointer; }
  .exercise-log { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 12px; align-items: start; }
  .previous-log { border-left: 1px solid #E4DFCF; padding-left: 12px; min-height: 58px; }
  .previous-log .tag { margin-bottom: 6px; display: block; }
  .previous-set { color: #4A4844; font-size: 12px; line-height: 1.6; white-space: nowrap; }
  .previous-empty { color: #8B8680; font-size: 11px; line-height: 1.35; }

  .navbar { position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); }
  .navbar-inner { max-width: 480px; margin: 0 auto; background: #F3EFE6; border-top: 1px solid #E4DFCF; display: flex; justify-content: space-around; padding: 8px 4px; }
  .navbtn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8B8680; padding: 6px 8px; cursor: pointer; }
  .navbtn.active { color: #B5502F; }
  .navbtn span { font-size: 10px; font-weight: 500; }

  .tag { color: #8B8680; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; }
  .empty { background: #26241F; color: #8B8680; border-radius: 18px; padding: 24px; text-align: center; font-size: 14px; }

  #auth-screen { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: #1A1918; padding: 28px 16px; display: flex; align-items: center; justify-content: center; }
  #auth-screen[hidden], #app[hidden] { display: none !important; }
  #auth-screen .auth-card { max-width: 448px; }
  .auth-card { width: 100%; background: #F3EFE6; color: #1A1918; border-radius: 18px; padding: 24px; }
  .auth-card h1 { margin: 0 0 6px; font-size: 30px; }
  .auth-card p { color: #8B8680; font-size: 14px; line-height: 1.45; margin: 0 0 20px; }
  .auth-card label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 5px; }
  .auth-error { color: #B5502F; font-size: 13px; margin: 12px 0 0; min-height: 18px; }
  .auth-toggle { color: #B5502F; background: none; border: none; padding: 12px 0 0; font-size: 13px; cursor: pointer; }
  .account-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #8B8680; font-size: 12px; padding: 0 0 10px; }
  .account-bar button { color: #B5502F; background: none; border: none; font-size: 12px; cursor: pointer; padding: 4px 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-val { font-size: 24px; font-weight: 700; }

  .method-intro { background: #26241F; color: #F3EFE6; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .method-intro p { color: #B8B1A5; font-size: 13px; line-height: 1.45; margin: 5px 0 14px; }
  .method-1rm { display: flex; align-items: center; gap: 10px; }
  .method-1rm label { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .method-1rm input { flex: 1; background: #F3EFE6; border-color: #F3EFE6; }
  .method-scroll { overflow-x: auto; margin: -4px; padding: 4px; }
  .method-table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: 12px; }
  .method-table th { color: #8B8680; font-size: 10px; letter-spacing: 0.04em; text-align: left; padding: 0 8px 8px; }
  .method-table th:first-child, .method-table td:first-child { padding-left: 0; }
  .method-table td { border-top: 1px solid #E4DFCF; padding: 10px 8px; vertical-align: middle; }
  .method-table .week { font-weight: 700; color: #B5502F; width: 38px; }
  .method-table .scheme { font-weight: 700; white-space: nowrap; }
  .method-table .load { color: #4A4844; white-space: nowrap; }
  .method-table .load strong { color: #1A1918; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; }
  .month-nav button { background: none; border: none; color: #1A1918; font-size: 18px; padding: 4px 8px; cursor: pointer; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .cal-daylabel { text-align: center; font-size: 10px; font-weight: 600; color: #8B8680; }
  .cal-cell { aspect-ratio: 1; border-radius: 10px; border: 1px solid #E4DFCF; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; position: relative; cursor: pointer; }
  .cal-cell.selected { background: #B5502F; color: #F3EFE6; border-color: #B5502F; }
  .cal-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: #B5502F; }
  .cal-cell.selected .cal-dot { background: #F3EFE6; }
  .cal-cell.empty-cell { border: none; background: transparent; cursor: default; }

  svg text { font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="auth-screen" hidden></div>
<div id="app" hidden>
  <div id="content"></div>
  <div class="navbar"><div class="navbar-inner" id="navbar"></div></div>
</div>

<script>
// ---------------- storage ----------------
const SUPABASE_URL = "https://zgrinrjufkczplkdnemr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ksl6eBYDxcXiQOC9YcHEtw_IrLVMtts";
const supabaseConfigured = !SUPABASE_URL.startsWith("REEMPLAZA_") && !SUPABASE_ANON_KEY.startsWith("REEMPLAZA_");
const supabaseClient = supabaseConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function saveData() {
  if (!supabaseClient || !state.user) return Promise.resolve();
  return Promise.all([
    ...state.routines.map(r => supabaseClient.from("routines").upsert({ id: r.id, user_id: state.user.id, name: r.name, exercises: r.exercises })),
    ...state.sessions.map(s => supabaseClient.from("sessions").upsert({ id: s.id, user_id: state.user.id, date: s.date, routine_name: s.routineName, exercises: s.exercises })),
    supabaseClient.from("preferences").upsert({ user_id: state.user.id, one_rm: state.method.oneRm })
  ]).then(results => {
    const failed = results.find(result => result.error);
    if (failed) throw failed.error;
  }).catch(error => {
    console.error("Supabase save error", error);
    alert("No se pudieron sincronizar los cambios. Revisá tu conexión.");
  });
}

async function loadUserData(user) {
  const [routinesResult, sessionsResult, preferencesResult] = await Promise.all([
    supabaseClient.from("routines").select("id,name,exercises").eq("user_id", user.id).order("created_at"),
    supabaseClient.from("sessions").select("id,date,routine_name,exercises").eq("user_id", user.id).order("date"),
    supabaseClient.from("preferences").select("one_rm").eq("user_id", user.id).maybeSingle()
  ]);
  const failure = [routinesResult, sessionsResult, preferencesResult].find(result => result.error);
  if (failure) throw failure.error;
  state.routines = routinesResult.data.length ? routinesResult.data : DEFAULT_ROUTINES;
  state.sessions = sessionsResult.data.map(s => ({ ...s, routineName: s.routine_name }));
  state.method.oneRm = preferencesResult.data?.one_rm || 120;
  if (!routinesResult.data.length) await saveData();
}

async function removeCloudRecord(table, id) {
  if (!supabaseClient || !state.user) return;
  const { error } = await supabaseClient.from(table).delete().eq("id", id).eq("user_id", state.user.id);
  if (error) console.error("Supabase delete error", error);
}

const DEFAULT_ROUTINES = [
  { id: "tren-inferior", name: "Tren inferior", exercises: ["Sentadilla", "Peso muerto", "Prensa", "Zancadas"] },
  { id: "empuje", name: "Empuje", exercises: ["Press banca", "Press militar", "Press inclinado", "Extensión de tríceps"] },
  { id: "tiron", name: "Tirón", exercises: ["Remo con barra", "Dominadas", "Jalón al pecho", "Curl de bíceps"] },
];

const state = {
  user: null,
  tab: "registrar",
  routines: DEFAULT_ROUTINES,
  sessions: [],
  // registrar transient state
  reg: { selected: null, entries: {}, editingSessionId: null },
  // calendar transient
  cal: { year: new Date().getFullYear(), month: new Date().getMonth(), selectedDate: null },
  // resumen transient
  res: { year: new Date().getFullYear(), month: new Date().getMonth() },
  // progreso transient
  prog: { exercise: null },
  // método transient
  method: { oneRm: 120 },
};

function uid() { return Math.random().toString(36).slice(2, 10); }
function fmtDateKey(d) { return d.toISOString().slice(0, 10); }
const DAY_LABELS = ["L","M","M","J","V","S","D"];
const MONTH_LABELS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function mondayIndex(date){ return (date.getDay()+6)%7; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let authMode = "login";
function renderAuth(errorMessage = "") {
  const screen = document.getElementById("auth-screen");
  screen.hidden = false;
  document.getElementById("app").hidden = true;
  screen.innerHTML = `<div class="auth-card">
    <h1 class="display">Gym Tracker</h1>
    <p>${authMode === "login" ? "Ingresá para ver tus rutinas y progresos en cualquier dispositivo." : "Creá tu cuenta para guardar tus rutinas y progresos."}</p>
    <form onsubmit="submitAuth(event)">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" autocomplete="email" required>
      <label for="authPassword">Contraseña</label>
      <input id="authPassword" type="password" minlength="6" autocomplete="${authMode === "login" ? "current-password" : "new-password"}" required>
      <button class="btn btn-primary" style="margin-top:18px;" type="submit">${authMode === "login" ? "Iniciar sesión" : "Crear cuenta"}</button>
    </form>
    <div class="auth-error">${esc(errorMessage)}</div>
    <button class="auth-toggle" onclick="toggleAuthMode()">${authMode === "login" ? "¿No tenés cuenta? Crear una" : "Ya tengo una cuenta"}</button>
  </div>`;
}
function toggleAuthMode() { authMode = authMode === "login" ? "signup" : "login"; renderAuth(); }
async function submitAuth(event) {
  event.preventDefault();
  if (!supabaseClient) { renderAuth("Primero configurá las credenciales de Supabase."); return; }
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  try {
    const result = authMode === "login"
      ? await supabaseClient.auth.signInWithPassword({ email, password })
      : await supabaseClient.auth.signUp({ email, password });
    if (result.error) { renderAuth(result.error.message); return; }
    if (authMode === "signup" && !result.data.session) {
      renderAuth("Cuenta creada. Revisá tu email para confirmar la cuenta.");
    }
  } catch (error) {
    renderAuth("No se pudo conectar con el servidor. Revisá tu conexión e intentá otra vez.");
  }
}
async function signOut() { await supabaseClient.auth.signOut(); }
async function applySession(session) {
  state.user = session?.user || null;
  if (!state.user) { renderAuth(); return; }
  try {
    await loadUserData(state.user);
    document.getElementById("auth-screen").hidden = true;
    document.getElementById("app").hidden = false;
    render();
  } catch (error) {
    console.error("Supabase load error", error);
    renderAuth("No se pudieron cargar tus datos. Verificá el esquema de Supabase.");
  }
}
async function initializeApp() {
  if (!supabaseConfigured) {
    renderAuth("Configurá SUPABASE_URL y SUPABASE_ANON_KEY en este archivo para comenzar.");
    return;
  }
  supabaseClient.auth.onAuthStateChange((_event, session) => applySession(session));
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) renderAuth(error.message);
  else if (data.session) await applySession(data.session);
  else renderAuth();
}

// ---------------- icons (inline svg) ----------------
const ICONS = {
  dumbbell: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M4 9l3-3M17 20l3-3M2 12l2-2M22 12l-2 2M9 4l-3 3M20 17l-3 3"/></svg>`,
  list: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>`,
  trend: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></svg>`,
  calendar: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  chart: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18M8 17V9M13 17V5M18 17v-7"/></svg>`,
  plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  x: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  check: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>`,
  chevL: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  chevR: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
};

// ---------------- render root ----------------
function render() {
  renderHeader();
  renderNav();
  const el = document.getElementById("content");
  let headerHtml = `<div class="account-bar"><span>${esc(state.user?.email || "")}</span><button onclick="signOut()">Cerrar sesión</button></div><div class="header"><h1 class="display">${titleFor(state.tab)}</h1><div class="bar"></div></div><div style="padding:0 0">`;
  let body = "";
  if (state.tab === "registrar") body = renderRegistrar();
  if (state.tab === "rutinas") body = renderRutinas();
  if (state.tab === "progreso") body = renderProgreso();
  if (state.tab === "calendario") body = renderCalendario();
  if (state.tab === "resumen") body = renderResumen();
  if (state.tab === "metodo") body = renderMetodo();
  el.innerHTML = headerHtml + `<div style="padding:0 0 0;">${body}</div></div>`;
}
function titleFor(t){
  return { registrar:"Registrar", rutinas:"Rutinas", progreso:"Progreso", calendario:"Calendario", resumen:"Resumen", metodo:"Método" }[t];
}
function renderHeader(){} // header rendered inline in render()

function renderNav() {
  const tabs = [
    { id: "registrar", label: "Registrar", icon: ICONS.dumbbell },
    { id: "rutinas", label: "Rutinas", icon: ICONS.list },
    { id: "progreso", label: "Progreso", icon: ICONS.trend },
    { id: "calendario", label: "Calendario", icon: ICONS.calendar },
    { id: "resumen", label: "Resumen", icon: ICONS.chart },
    { id: "metodo", label: "Método", icon: ICONS.list },
  ];
  document.getElementById("navbar").innerHTML = tabs.map(t => `
    <button class="navbtn ${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${t.icon}<span>${t.label}</span>
    </button>
  `).join("");
}

function setTab(t){ state.tab = t; render(); }

// ---------------- REGISTRAR ----------------
function previousSessionForExercise(exerciseName) {
  return state.sessions
    .filter(session => session.exercises.some(exercise => exercise.name === exerciseName))
    .sort((a, b) => b.date.localeCompare(a.date))[0];
}

function renderRegistrar(){
  if (!state.reg.selected) {
    let html = state.routines.map(r => `
      <button class="btn-routine" onclick="startRoutine('${r.id}')">
        <div style="font-weight:600;font-size:17px;">${esc(r.name)}</div>
        <div class="sub" style="margin-top:2px;">${esc(r.exercises.join(" · "))}</div>
      </button>
    `).join("");
    html += `<button class="btn-ghost" onclick="startFree()">+ Sesión libre</button>`;
    return html;
  }

  const sel = state.reg.selected;
  let html = `<div class="row" style="justify-content:space-between;margin-bottom:12px;">
      <div style="font-weight:600;font-size:18px;">${esc(sel.name)}</div>
      <button class="icon-btn" style="color:#8B8680" onclick="cancelReg()">${ICONS.x}</button>
    </div>`;

  if (sel.id === "libre") {
    html += `<div class="row" style="margin-bottom:12px;">
      <input id="freeExName" placeholder="Nombre del ejercicio" style="flex:1"/>
      <button class="btn" style="background:#B5502F;color:#F3EFE6;flex-shrink:0" onclick="addFreeExercise()">Agregar</button>
    </div>`;
  }

  if (state.reg.editingSessionId) {
    html += `<div style="margin-bottom:10px; color:#8B8680; font-size:12px;">Editando sesión del ${new Date(state.sessions.find(s => s.id === state.reg.editingSessionId)?.date || Date.now()).toLocaleDateString("es-AR", {day:"2-digit", month:"short", year:"numeric"})}</div>`;
  }

  Object.keys(state.reg.entries).forEach(ex => {
    const sets = state.reg.entries[ex];
    const previousSession = previousSessionForExercise(ex);
    const previousExercise = previousSession?.exercises.find(item => item.name === ex);
    const previousHtml = previousExercise
      ? previousExercise.sets.map((set, index) => `<div class="previous-set">${index + 1}. ${esc(set.weight)} kg × ${esc(set.reps)}</div>`).join("")
      : `<div class="previous-empty">Todavía no hay registros.</div>`;
    html += `<div class="card"><h3>${esc(ex)}</h3><div class="exercise-log" style="margin-top:8px;"><div>`;
    sets.forEach((s, idx) => {
      html += `<div class="row-set">
        <span class="set-num">${idx+1}</span>
        <input type="number" inputmode="decimal" placeholder="kg" value="${s.weight}" style="flex:1"
          oninput="updateSet('${esc(ex)}',${idx},'weight',this.value)"/>
        <input type="number" inputmode="numeric" placeholder="reps" value="${s.reps}" style="flex:1"
          oninput="updateSet('${esc(ex)}',${idx},'reps',this.value)"/>
        <button class="icon-btn" onclick="removeSet('${esc(ex)}',${idx})">${ICONS.x}</button>
      </div>`;
    });
    html += `<button class="icon-btn" style="display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-top:4px;" onclick="addSet('${esc(ex)}')">${ICONS.plus} Serie</button>`;
    html += `</div><div class="previous-log"><span class="tag">ÚLTIMA SESIÓN</span>${previousHtml}</div></div></div>`;
  });

  html += `<button class="btn btn-primary" style="margin-top:8px;" onclick="finishSession()">${ICONS.check} ${state.reg.editingSessionId ? "Guardar cambios" : "Guardar sesión"}</button>`;
  return html;
}

function editSession(id) {
  const session = state.sessions.find(s => s.id === id);
  if (!session) return;

  state.tab = "registrar";
  state.reg.selected = { id: `edit-${session.id}`, name: session.routineName };
  state.reg.entries = {};
  state.reg.editingSessionId = id;

  session.exercises.forEach(ex => {
    state.reg.entries[ex.name] = ex.sets.map(set => ({ weight: String(set.weight), reps: String(set.reps) }));
  });

  render();
}

function startRoutine(routineId) {
  const r = state.routines.find(x => x.id === routineId);
  state.reg.selected = r;
  state.reg.entries = {};
  state.reg.editingSessionId = null;
  r.exercises.forEach(ex => state.reg.entries[ex] = [{weight:"",reps:""}]);
  render();
}
function startFree() {
  state.reg.selected = { id: "libre", name: "Sesión libre" };
  state.reg.entries = {};
  state.reg.editingSessionId = null;
  render();
}
function cancelReg() {
  state.reg.selected = null;
  state.reg.entries = {};
  state.reg.editingSessionId = null;
  render();
}
function addFreeExercise() {
  const input = document.getElementById("freeExName");
  const name = input.value.trim();
  if (!name) return;
  state.reg.entries[name] = [{weight:"",reps:""}];
  render();
}
function addSet(ex) {
  state.reg.entries[ex].push({weight:"",reps:""});
  render();
}
function updateSet(ex, idx, field, value) {
  state.reg.entries[ex][idx][field] = value;
  // no full render needed to avoid losing focus; but keep simple & safe:
}
function removeSet(ex, idx) {
  state.reg.entries[ex] = state.reg.entries[ex].filter((_,i)=>i!==idx);
  render();
}
function finishSession() {
  const exercisesLogged = Object.entries(state.reg.entries).map(([name, sets]) => ({
    name,
    sets: sets.filter(s => s.weight !== "" && s.reps !== "").map(s => ({ weight: parseFloat(s.weight)||0, reps: parseInt(s.reps)||0 }))
  })).filter(e => e.sets.length > 0);

  if (exercisesLogged.length === 0) { alert("Cargá al menos una serie con peso y reps."); return; }

  const sessionDate = state.reg.editingSessionId
    ? state.sessions.find(s => s.id === state.reg.editingSessionId)?.date || fmtDateKey(new Date())
    : fmtDateKey(new Date());

  if (state.reg.editingSessionId) {
    const idx = state.sessions.findIndex(s => s.id === state.reg.editingSessionId);
    if (idx >= 0) {
      state.sessions[idx] = {
        ...state.sessions[idx],
        routineName: state.reg.selected.name,
        exercises: exercisesLogged,
      };
    }
  } else {
    state.sessions.push({
      id: uid(),
      date: sessionDate,
      routineName: state.reg.selected.name,
      exercises: exercisesLogged,
    });
  }

  saveData();
  state.reg.selected = null;
  state.reg.entries = {};
  state.reg.editingSessionId = null;
  render();
}

// ---------------- RUTINAS ----------------
function renderRutinas(){
  let html = state.routines.map(r => `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px;">
        <div style="font-weight:600;">${esc(r.name)}</div>
        <button class="icon-btn" onclick="removeRoutine('${r.id}')">${ICONS.trash}</button>
      </div>
      ${r.exercises.map((ex,idx)=>`
        <div class="row" style="justify-content:space-between;font-size:14px;color:#4A4844;margin-bottom:4px;">
          <span>${esc(ex)}</span>
          <button class="icon-btn" style="color:#8B8680" onclick="removeExercise('${r.id}',${idx})">${ICONS.x}</button>
        </div>`).join("")}
      <div class="row" style="margin-top:8px;">
        <input id="exinput-${r.id}" placeholder="Nuevo ejercicio" style="flex:1"/>
        <button class="icon-btn" style="font-weight:600;font-size:13px;" onclick="addExercise('${r.id}')">Agregar</button>
      </div>
    </div>
  `).join("");

  html += `<div class="card row">
    <input id="newRoutineName" placeholder="Nueva rutina" style="flex:1"/>
    <button class="btn" style="background:#B5502F;color:#F3EFE6;flex-shrink:0;" onclick="addRoutine()">${ICONS.plus}</button>
  </div>`;
  return html;
}
function addRoutine() {
  const input = document.getElementById("newRoutineName");
  const name = input.value.trim();
  if (!name) return;
  state.routines.push({ id: uid(), name, exercises: [] });
  saveData(); render();
}
function removeRoutine(id) {
  state.routines = state.routines.filter(r => r.id !== id);
  removeCloudRecord("routines", id).then(() => saveData()).then(render);
}
function addExercise(routineId) {
  const input = document.getElementById("exinput-" + routineId);
  const name = input.value.trim();
  if (!name) return;
  const r = state.routines.find(x => x.id === routineId);
  r.exercises.push(name);
  saveData(); render();
}
function removeExercise(routineId, idx) {
  const r = state.routines.find(x => x.id === routineId);
  r.exercises.splice(idx, 1);
  saveData(); render();
}

// ---------------- PROGRESO ----------------
function allExercisesList() {
  const set = new Set();
  state.routines.forEach(r => r.exercises.forEach(e => set.add(e)));
  state.sessions.forEach(s => s.exercises.forEach(e => set.add(e.name)));
  return Array.from(set);
}
function renderProgreso(){
  const all = allExercisesList();
  if (all.length === 0) return `<div class="empty">Registrá una sesión para ver tu progreso.</div>`;
  if (!state.prog.exercise || !all.includes(state.prog.exercise)) state.prog.exercise = all[0];
  const exercise = state.prog.exercise;

  const points = [];
  state.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => {
    const ex = s.exercises.find(e => e.name === exercise);
    if (!ex || ex.sets.length === 0) return;
    const maxWeight = Math.max(...ex.sets.map(st => st.weight));
    const volume = ex.sets.reduce((sum, st) => sum + st.weight*st.reps, 0);
    points.push({ date: s.date.slice(5), maxWeight, volume });
  });

  let html = `<select onchange="setProgExercise(this.value)" style="margin-bottom:14px;font-weight:600;">
    ${all.map(ex => `<option value="${esc(ex)}" ${ex===exercise?'selected':''}>${esc(ex)}</option>`).join("")}
  </select>`;

  if (points.length === 0) {
    html += `<div class="empty">Sin datos todavía para ${esc(exercise)}.</div>`;
    return html;
  }

  const last = points[points.length-1], first = points[0];
  const wDelta = (last.maxWeight - first.maxWeight).toFixed(1);
  const vDelta = (last.volume - first.volume).toFixed(0);

  html += chartCard("PESO MÁXIMO POR SESIÓN", last.maxWeight + " kg", wDelta, points, "maxWeight", "#B5502F");
  html += chartCard("VOLUMEN TOTAL POR SESIÓN", last.volume + " kg", vDelta, points, "volume", "#1A1918");
  return html;
}
function setProgExercise(v) { state.prog.exercise = v; render(); }

function chartCard(title, value, delta, points, key, color) {
  const w = 300, h = 120, pad = 8;
  const vals = points.map(p => p[key]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((p[key]-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?"M":"L") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="${color}"/>`).join("");
  const deltaNum = parseFloat(delta);
  return `<div class="card">
    <div class="tag">${title}</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 10px;">
      <span style="font-size:20px;font-weight:700;">${value}</span>
      <span style="font-size:12px;font-weight:600;color:${deltaNum>=0?'#5B7A4A':'#B5502F'}">(${deltaNum>=0?'+':''}${delta})</span>
    </div>
    <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
  </div>`;
}

// ---------------- CALENDARIO ----------------
function sessionsByDate() {
  const map = {};
  state.sessions.forEach(s => { (map[s.date] = map[s.date] || []).push(s); });
  return map;
}
function renderCalendario(){
  const { year, month } = state.cal;
  const map = sessionsByDate();
  const first = new Date(year, month, 1);
  const total = daysInMonth(year, month);
  const leading = mondayIndex(first);

  let cells = [];
  for (let i=0;i<leading;i++) cells.push(null);
  for (let d=1; d<=total; d++) cells.push(d);

  let html = `<div class="card">
    <div class="month-nav">
      <button onclick="calChangeMonth(-1)">${ICONS.chevL}</button>
      <div style="font-weight:600;font-size:14px;">${MONTH_LABELS[month]} de ${year}</div>
      <button onclick="calChangeMonth(1)">${ICONS.chevR}</button>
    </div>
    <div class="cal-grid">
      ${DAY_LABELS.map(d=>`<div class="cal-daylabel">${d}</div>`).join("")}
      ${cells.map(d => {
        if (d === null) return `<div class="cal-cell empty-cell"></div>`;
        const key = fmtDateKey(new Date(year, month, d));
        const has = !!map[key];
        const isSel = state.cal.selectedDate === key;
        return `<button class="cal-cell ${isSel?'selected':''}" onclick="calSelectDay('${key}')">${d}${has?'<span class="cal-dot"></span>':''}</button>`;
      }).join("")}
    </div>
  </div>`;

  if (state.cal.selectedDate) {
    const daySessions = map[state.cal.selectedDate] || [];
    if (daySessions.length === 0) {
      html += `<div class="empty">Sin sesiones este día.</div>`;
    } else {
      html += daySessions.map(s => `
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:6px;">
            <span style="font-weight:600;font-size:14px;">${esc(s.routineName)}</span>
            <div class="row" style="gap:4px;">
              <button class="icon-btn" style="color:#B5502F" onclick="editSession('${s.id}')">Editar</button>
              <button class="icon-btn" style="color:#8B8680" onclick="deleteSession('${s.id}')">${ICONS.trash}</button>
            </div>
          </div>
          ${s.exercises.map(ex => `
            <div style="font-size:12px;color:#4A4844;margin-bottom:2px;">
              <span style="font-weight:600;">${esc(ex.name)}:</span> ${ex.sets.map(st=>st.weight+'kg×'+st.reps).join(", ")}
            </div>`).join("")}
        </div>
      `).join("");
    }
  }
  return html;
}
function calChangeMonth(delta) {
  let m = state.cal.month + delta, y = state.cal.year;
  if (m<0){m=11;y--;} if (m>11){m=0;y++;}
  state.cal.month = m; state.cal.year = y; state.cal.selectedDate = null;
  render();
}
function calSelectDay(key) {
  state.cal.selectedDate = state.cal.selectedDate === key ? null : key;
  render();
}
function deleteSession(id) {
  state.sessions = state.sessions.filter(s => s.id !== id);
  removeCloudRecord("sessions", id).then(() => saveData()).then(render);
}

// ---------------- RESUMEN ----------------
function renderResumen(){
  const { year, month } = state.res;
  const monthSessions = state.sessions.filter(s => {
    const d = new Date(s.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });
  const totalVolume = monthSessions.reduce((sum,s) => sum + s.exercises.reduce((sv,ex)=> sv + ex.sets.reduce((ss,st)=>ss+st.weight*st.reps,0),0), 0);

  const byExercise = {};
  monthSessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => {
    s.exercises.forEach(ex => {
      const maxW = Math.max(...ex.sets.map(st=>st.weight));
      if (!byExercise[ex.name]) byExercise[ex.name] = { first: maxW, last: maxW };
      else byExercise[ex.name].last = maxW;
    });
  });
  const gains = Object.entries(byExercise).map(([name,v])=>({name, delta: v.last - v.first}))
    .filter(g=>g.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,5);

  let html = `<div class="card month-nav">
    <button onclick="resChangeMonth(-1)">${ICONS.chevL}</button>
    <div style="font-weight:600;font-size:14px;">${MONTH_LABELS[month]} de ${year}</div>
    <button onclick="resChangeMonth(1)">${ICONS.chevR}</button>
  </div>`;

  html += `<div class="grid2" style="margin-bottom:14px;">
    <div class="card"><div class="tag">SESIONES</div><div class="stat-val">${monthSessions.length}</div></div>
    <div class="card"><div class="tag">VOLUMEN TOTAL</div><div class="stat-val">${totalVolume}<span style="font-size:13px;font-weight:500;"> kg</span></div></div>
  </div>`;

  html += `<div class="tag" style="margin-bottom:8px;display:block;">DONDE MÁS SUBISTE</div>`;
  if (gains.length === 0) {
    html += `<div class="empty">Sin mejoras registradas este mes todavía.</div>`;
  } else {
    html += gains.map(g => `
      <div class="card row" style="justify-content:space-between;">
        <span style="font-size:14px;font-weight:500;">${esc(g.name)}</span>
        <span style="font-size:14px;font-weight:600;color:#B5502F;">+${g.delta} kg</span>
      </div>`).join("");
  }
  return html;
}
function resChangeMonth(delta) {
  let m = state.res.month + delta, y = state.res.year;
  if (m<0){m=11;y--;} if (m>11){m=0;y++;}
  state.res.month = m; state.res.year = y;
  render();
}

// ---------------- METODO ----------------
const METHOD_WEEKS = [
  [1, "4×5", "72.5", "3×8", "65"],
  [2, "4×5", "75", "3×8", "67.5"],
  [3, "4×4", "77.5", "3×7", "70"],
  [4, "3×4", "65", "2×6", "60"],
  [5, "5×4", "77.5", "3×6", "70"],
  [6, "4×3", "82.5", "3×6", "72.5"],
  [7, "5×3", "85", "3×5", "75"],
  [8, "3×4", "65", "2×5", "60"],
  [9, "4×3", "85", "3×5", "72.5"],
  [10, "4×2", "87.5", "3×5", "70"],
  [11, "3×2", "90", "3×4", "67.5"],
  [12, "2–3×1 + test", "92.5–100", "—", "—"],
];

function methodLoad(percent, oneRm) {
  if (percent === "—") return "—";
  const values = percent.split("–").map(p => Math.round(oneRm * parseFloat(p) / 100));
  return values.length > 1 ? `${values[0]}–${values[1]} kg` : `${values[0]} kg`;
}
function updateMethodOneRm(value) {
  const oneRm = parseFloat(value);
  if (Number.isFinite(oneRm) && oneRm > 0) {
    state.method.oneRm = oneRm;
    saveData();
    render();
  }
}
function renderMetodo() {
  const oneRm = state.method.oneRm;
  return `<div class="method-intro">
    <div style="font-weight:600;font-size:17px;">Método de 12 semanas</div>
    <p>Alterná un día de fuerza y un día de volumen. Los kilos se calculan a partir de tu 1RM.</p>
    <div class="method-1rm">
      <label for="methodOneRm">Tu 1RM</label>
      <input id="methodOneRm" type="number" inputmode="decimal" min="1" step="0.5" value="${oneRm}" onchange="updateMethodOneRm(this.value)" aria-label="Tu 1RM en kilogramos">
      <span style="font-size:13px;color:#B8B1A5;">kg</span>
    </div>
  </div>
  <div class="card method-scroll">
    <table class="method-table">
      <thead><tr>
        <th>SEM.</th><th>DÍA FUERZA</th><th>% 1RM</th><th>DÍA VOLUMEN</th><th>% 1RM</th>
      </tr></thead>
      <tbody>${METHOD_WEEKS.map(([week, forceSets, forcePct, volumeSets, volumePct]) => `
        <tr>
          <td class="week">${week}</td>
          <td class="scheme">${forceSets}</td>
          <td class="load">${forcePct}% <strong>— ${methodLoad(forcePct, oneRm)}</strong></td>
          <td class="scheme">${volumeSets}</td>
          <td class="load">${volumePct === "—" ? "—" : `${volumePct}% <strong>— ${methodLoad(volumePct, oneRm)}</strong>`}</td>
        </tr>`).join("")}</tbody>
    </table>
  </div>`;
}
